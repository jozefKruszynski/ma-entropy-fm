name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check --no-fix .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run codespell

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest

  # every channel the registry checks releases on: nightly, beta and one per stable version
  channels:
    name: Catalog channels
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - id: read
        env:
          CHANNELS_URL: https://raw.githubusercontent.com/music-assistant/community-catalog/main/channels.json
        run: echo "list=$(curl -fsSL "$CHANNELS_URL" | jq -c '.channels | keys')" >> "$GITHUB_OUTPUT"

  # the checks every release gets in the catalog: the manifest, the requirements against a
  # channel and loading the provider in the server image of that channel
  catalog:
    name: Catalog checks
    needs: channels
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.channels.outputs.list) }}
    uses: music-assistant/community-catalog/.github/workflows/check-provider.yml@main
    with:
      folder: entropy_fm
      channel: ${{ matrix.channel }}
